name: Build Paper Mono Nerd Patched

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@v4.2.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.29"
          python-version: "3.13"

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Install FontForge in the runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fontforge python3-fontforge

      - name: Check repository scripts
        run: uv run --locked poe check

      - name: Build and verify fonts
        run: uv run --locked poe all

      - name: Upload font artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: paper-mono-nerd-patched
          path: dist/
          if-no-files-found: error
